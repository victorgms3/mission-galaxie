<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QA — regard critique</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/resolution.css">
  <link rel="stylesheet" href="../css/jeu.css">
</head>
<body>
  <!--
    Page de relecture (regard enfant / visuel / pédagogie) : charge les mêmes scripts que index.html,
    prépare une sauvegarde et affiche l'écran demandé.
      ?ecran=config | histoire[&page=2] | titre | espace | carnet[&onglet=souvenirs|grades] | code | coach
      ?ecran=planete&monde=paquets[&etat=debut|milieu|fin][&visite=1][&bulle=0][&pos=5,20]
          &pnj=<id> (parle à l'habitant) [&aider=1 [&etape=schema|…|fin|apres] [&faute=1] [&indice=2]]
          &coffre=<id> [&faux=1] | &panneau=<id> | &fusee=1 | &porte=<zone>
          &scenario=zone (le problème qui ouvre la zone 2) | chef (le dernier problème du chef)
      ?ecran=echantillon&monde=plusmoins&niveau=1   (mode dom : les 48 problèmes tirés comme dans le jeu)
      &voix=1 (Alvin parle) &prenom=Léa
  -->
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <pre id="resultat" hidden>en cours…</pre>

  <script src="../js/core/ui.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/icones.js"></script>
  <script src="../js/core/voix.js"></script>
  <script src="../js/core/sons.js"></script>
  <script src="../js/art/art.js"></script>
  <script src="../js/art/alvin.js"></script>
  <script src="../js/problemes/moteur.js"></script>
  <script src="../js/problemes/banques/plusmoins-1.js"></script>
  <script src="../js/problemes/banques/plusmoins-2.js"></script>
  <script src="../js/problemes/banques/paquets-1.js"></script>
  <script src="../js/problemes/banques/paquets-2.js"></script>
  <script src="../js/problemes/banques/marche-1.js"></script>
  <script src="../js/problemes/banques/marche-2.js"></script>
  <script src="../js/monde/mondes.js"></script>
  <script src="../js/monde/mondes/plusmoins.js"></script>
  <script src="../js/monde/mondes/paquets.js"></script>
  <script src="../js/monde/mondes/marche.js"></script>
  <script src="../js/monde/mondes/tictac.js"></script>
  <script src="../js/monde/moteur.js"></script>
  <script src="../js/resolution/widgets.js"></script>
  <script src="../js/resolution/resolution.js"></script>
  <script src="../js/jeu/ecrans.js"></script>
  <script src="../js/jeu/jeu.js"></script>
  <script>
  'use strict';
  (async () => {
    const prm = new URLSearchParams(location.search);
    const P = k => prm.get(k);
    // En capture headless, les animations CSS ne suivent pas le temps virtuel : on les coupe (état final)
    if (P('anim') !== '1') document.head.append(UI.h('style', null, '*, *::before, *::after { animation: none !important; transition: none !important; }'));
    const sortie = document.getElementById('resultat');
    const erreursJS = [];
    window.addEventListener('error', e => erreursJS.push(`${(e.filename || '').split('/').pop()}:${e.lineno} ${e.message}`));
    const ecrire = o => { sortie.textContent = JSON.stringify(o, null, 1); };
    const pause = ms => new Promise(r => setTimeout(r, ms));

    // ------------------------------------------------------------------
    // Sauvegarde préparée
    // ------------------------------------------------------------------
    Store.charger();
    const D = Store.data;
    D.profil = { prenom: P('prenom') || 'Léa', genre: 'f', code: '1234', amis: [{ n: 'Inès', g: 'f' }, { n: 'Tom', g: 'm' }] };
    D.introVue = true;
    D.reglages.alvinParle = P('voix') === '1';
    D.reglages.lectureAuto = P('voix') === '1';
    D.reglages.sons = false;
    const idMonde = P('monde') || 'plusmoins';
    const avancement = P('etat') || 'debut';

    function journalFactice(n, notion) {
      const J = [];
      for (let i = 0; i < n; i++) {
        J.push({ date: Date.now() - (n - i) * 3e5, notion, planete: notion, pnj: 'tobo', id: notion + '-1-00' + (i % 9), structure: 'TG', niveau: 1,
          erreurs: { question: i % 5 === 0 ? 1 : 0, infos: i % 3 === 0 ? 1 : 0, plan: 0, schema: i % 4 === 0 ? 1 : 0, operation: i % 2 ? 1 : 0, calcul: i % 6 === 0 ? 1 : 0, reponse: i % 7 === 0 ? 1 : 0 },
          aides: i % 3, etoiles: [3, 2, 1, 3, 2][i % 5] });
      }
      return J;
    }
    function remplirPlanete(id, mode) {
      const m = Mondes.get(id);
      const e = Store.planete(id);
      e.visitee = true;
      if (mode === 'fin') {
        m.pnj.forEach(p => { e.pnj[p.id] = 4; });
        e.resolus = 48; e.zones = [1, 2, 3, 4]; e.coffres = m.coffres.map(c => c.id); e.terminee = true;
        m.pnj.forEach(p => D.carnet.push(id + ':' + p.id));
        m.coffres.forEach(c => D.souvenirs.push(c.souvenir.id));
      } else if (mode === 'milieu') {
        const z1 = m.pnj.filter(p => p.zone === 1), z2 = m.pnj.filter(p => p.zone === 2);
        z1.forEach(p => { e.pnj[p.id] = 4; D.carnet.push(id + ':' + p.id); });
        e.pnj[z2[0].id] = 2;
        e.resolus = 14; e.zones = [1, 2];
        e.coffres = [m.coffres[0].id]; D.souvenirs.push(m.coffres[0].souvenir.id);
      }
    }
    if (avancement === 'milieu') {
      remplirPlanete(idMonde, 'milieu');
      D.etoiles = 34; D.journal = journalFactice(14, Mondes.get(idMonde).notion);
      D.notions[Mondes.get(idMonde).notion].historique = [1, 1, 0, 1, 1, 1, 0, 1];
    } else if (avancement === 'fin') {
      remplirPlanete('plusmoins', 'fin');
      remplirPlanete('paquets', 'milieu');
      D.debloquees = ['plusmoins', 'paquets', 'marche', 'tictac'];
      D.etoiles = 187; D.journal = journalFactice(62, 'plusmoins').concat(journalFactice(14, 'paquets'));
      D.notions.plusmoins.niveau = 2; D.notions.plusmoins.historique = [1, 1, 1, 0, 1];
      D.notions.paquets.historique = [1, 0, 1, 1, 1, 1];
    }
    if (!D.debloquees.includes(idMonde)) D.debloquees.push(idMonde);
    D.planeteActuelle = idMonde;
    if (P('visite') === '1') Store.planete(idMonde).visitee = true;
    if (P('zones')) Store.planete(idMonde).zones = P('zones').split(',').map(Number);
    if (P('resolus')) Store.planete(idMonde).resolus = +P('resolus');
    if (P('pos')) { const [x, y] = P('pos').split(',').map(Number); Store.planete(idMonde).pos = { x, y }; }
    if (P('niveau')) D.notions[Mondes.get(idMonde).notion].niveau = +P('niveau');
    Store.sauver();

    // ------------------------------------------------------------------
    // Outils : case libre voisine, automate de résolution
    // ------------------------------------------------------------------
    function caseLibreVoisine(m, x, y) {
      const occupees = new Set([...m.pnj, ...m.coffres, ...m.panneaux, m.fusee].map(e => e.x + ',' + e.y));
      for (const [dx, dy] of [[0, 1], [-1, 0], [1, 0], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        const c = (m.carte[ny] || '')[nx];
        if (c && Mondes.MARCHABLE.has(c) && !occupees.has(nx + ',' + ny)) return { x: nx, y: ny };
      }
      return null;
    }
    const $ = s => document.querySelector('#resolution ' + s);
    const $$ = s => [...document.querySelectorAll('#resolution ' + s)];
    const RD = () => Resolution.debug();
    async function attendre(cond, quoi, max = 1500) {
      for (let i = 0; i < max; i++) { if (cond()) return; await pause(20); }
      throw new Error('délai dépassé : ' + quoi + ' (étape ' + RD().etape + ')');
    }
    function taper(el, quoi) { if (!el) throw new Error('introuvable : ' + quoi); el.click(); }
    function pointeur(el, type, x, y) {
      el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 7, isPrimary: true, pointerType: 'touch' }));
    }
    function toucher(el, quoi) {
      if (!el) throw new Error('introuvable : ' + quoi);
      const r = el.getBoundingClientRect();
      pointeur(el, 'pointerdown', r.left + r.width / 2, r.top + r.height / 2);
      pointeur(el, 'pointerup', r.left + r.width / 2, r.top + r.height / 2);
    }
    const norm = s => String(s).replace(/[  ]/g, ' ');
    const memeTexte = (b, t) => norm(b.textContent) === norm(t);
    const touche = ch => taper($$('.clavier .touche').find(b => b.textContent === ch), 'touche ' + ch);
    const valider = () => taper($('.clavier .touche.valider'), 'valider');
    const effacer = () => taper($('.clavier .touche.effacer'), 'effacer');
    async function placerCarte(k, slot) {
      toucher($(`.res-plateau .res-carte[data-k="${k}"]`), 'carte ' + k);
      taper($(`.case[data-slot="${slot}"]`), 'case ' + slot);
      await pause(5);
    }
    async function ecrireNombre(v) {
      if ($('.pose')) {
        const cells = $$('.pose-resultat');
        const n = cells.length;
        const s = String(v).padStart(n, ' ');
        for (let i = n - 1; i >= 0; i--) {
          taper(cells[i], 'case du résultat');
          if (s[i] === ' ') { if (cells[i].textContent) effacer(); } else touche(s[i]);
        }
      } else if ($('.champ-h')) {
        const ch = $('.champ-h'), cm = $('.champ-min');
        taper(ch, 'heures'); while (ch.textContent) effacer();
        for (const c of String(Math.floor(v / 60))) touche(c);
        taper(cm, 'minutes'); while (cm.textContent) effacer();
        for (const c of String(v % 60)) touche(c);
      } else {
        const b = $('.res-boite-reponse');
        while (b.textContent) effacer();
        for (const c of String(v)) touche(c);
      }
    }
    // Une action juste (ou fausse si faute) à l'étape courante
    async function agir(d, faute = false) {
      const p = d.probleme;
      switch (d.etape) {
        case 'lire': taper($('[data-action="compris"]'), 'compris'); return;
        case 'question':
          if (faute) { taper($$('.phrase:not(.est-question)')[0], 'phrase'); return; }
          taper($('.phrase.est-question'), 'question'); return;
        case 'infos':
          if (faute) { const k = p.distracteur || p.utiles[0]; taper($(`.donnee[data-k="${p.distracteur || 'zz'}"]`) || $$('.donnee')[0], 'distracteur ' + k); return; }
          for (const k of p.utiles) {
            const el = $$(`.donnee[data-k="${k}"]`).find(x => x.classList.contains('cliquable'));
            if (el) { taper(el, 'donnée ' + k); await pause(5); }
          }
          return;
        case 'plan': {
          const q = p.etapes[0].question;
          if (faute) { taper($$('.choix-plan').find(b => !memeTexte(b, q)), 'mauvais plan'); return; }
          taper($$('.choix-plan').find(b => memeTexte(b, q)), 'bon plan'); return;
        }
        case 'schema': {
          if ($('[data-action="faire-schema"]')) taper($('[data-action="faire-schema"]'), 'faire le schéma');
          await attendre(() => $('.res-schema .case'), 'schéma');
          const slots = Object.entries(p.etapes[0].schema.slots);
          if (faute) {
            await placerCarte(slots[0][1], slots[1][0]);
            await placerCarte(slots[1][1], slots[0][0]);
            await placerCarte(slots[2][1], slots[2][0]);
            return;
          }
          for (const [slot, k] of slots) {
            const c = $(`.case[data-slot="${slot}"]`);
            if (c.querySelector(`.res-carte[data-k="${k}"]`)) continue;
            await placerCarte(k, slot);
          }
          return;
        }
        case 'operation': {
          const op = p.etapes[d.e].op;
          if (faute) { taper($$('.btn-op').find(b => b.dataset.signe !== op.signe), 'mauvais signe'); return; }
          taper($(`.btn-op[data-signe="${op.signe}"]`), 'bon signe'); return;
        }
        case 'calcul': {
          const op = p.etapes[d.e].op;
          if (faute) { await ecrireNombre(op.r + (op.formats.r === 'nombre' ? (op.r > 20 ? 10 : 1) : 10)); valider(); return; }
          await ecrireNombre(op.r); valider(); return;
        }
        case 'reponse':
          if (faute) { taper($$('.phrase-reponse').find(b => !memeTexte(b, p.reponse.juste)), 'mauvaise réponse'); return; }
          taper($$('.phrase-reponse').find(b => memeTexte(b, p.reponse.juste)), 'bonne réponse'); return;
        default: throw new Error('étape inconnue : ' + d.etape);
      }
    }
    // Avance jusqu'à l'étape demandée (ou jusqu'à la fin) ; renvoie l'état
    async function avancerJusqua(arret) {
      let dernier = -1;
      for (let tour = 0; tour < 40; tour++) {
        await attendre(() => !RD().actif || RD().etape === 'fin' || (!RD().verrou && RD().compteur !== dernier), 'étape suivante');
        const d = RD();
        if (!d.actif) return d;
        if (d.etape === arret) return d;
        if (d.etape === 'fin') return d;
        dernier = d.compteur;
        await agir(d);
      }
      return RD();
    }

    // ------------------------------------------------------------------
    // Écrans
    // ------------------------------------------------------------------
    const ecran = P('ecran') || 'titre';
    const rapport = { ecran, erreursJS };
    try {
      if (ecran === 'config') { D.profil = null; Ecrans.config(); }
      else if (ecran === 'histoire') {
        Ecrans.histoire();
        for (let i = 0; i < +(P('page') || 0); i++) { document.querySelector('.histoire .btn.principal').click(); await pause(50); }
      }
      else if (ecran === 'titre') Ecrans.titre();
      else if (ecran === 'espace') {
        Ecrans.espace();
        if (P('vers')) {
          const b = [...document.querySelectorAll('.espace-planete')].find(x => x.textContent.includes(P('vers')));
          if (b) { b.click(); await pause(+(P('voyageAttente') || 300)); }
        }
      }
      else if (ecran === 'carnet') {
        Ecrans.carnet();
        const o = P('onglet');
        if (o) { const b = [...document.querySelectorAll('.carnet-onglets button')].find(x => x.textContent.toLowerCase().includes(o)); if (b) b.click(); }
      }
      else if (ecran === 'code') { Ecrans.titre(); Ecrans.demanderCode(Ecrans.titre); }
      else if (ecran === 'coach') Ecrans.coach();
      else if (ecran === 'echantillon') {
        // Les 48 problèmes d'une planète, tirés comme dans le jeu (zone par zone, 4 par habitant)
        const m = Mondes.get(idMonde);
        const niv = +(P('niveau') || 1);
        const vus = [];
        let derniere = null;
        const liste = [];
        const structures = {};
        const modeles = new Set();
        const tri = m.pnj.slice().sort((a, b) => a.zone - b.zone);
        for (const p of tri) {
          for (let k = 0; k < 4; k++) {
            const pb = Problemes.tirer(m.notion, niv, Store.contexte({ nom: p.nom, g: p.g }), { exclure: new Set(vus), themes: p.themes, eviterStructure: derniere });
            if (!pb) { liste.push({ pnj: p.nom, erreur: 'aucun problème' }); continue; }
            vus.push(pb.id); derniere = pb.structure;
            structures[pb.structure] = (structures[pb.structure] || 0) + 1;
            modeles.add(pb.id);
            const texte = pb.oral.join(' ');
            liste.push({ pnj: p.nom + ' (' + p.themes.join('/') + ')', id: pb.id, st: pb.structure, op: pb.etapes.map(e => `${e.op.g} ${e.op.signe} ${e.op.d} = ${e.op.r}`).join(' ; '),
              mots: texte.split(/\s+/).length, piege: !!pb.distracteur, texte, juste: pb.reponse.juste, fausses: pb.reponse.fausses,
              labels: pb.etapes[0].schema ? pb.etapes[0].schema.labels : null });
          }
        }
        const mots = liste.filter(x => x.mots).map(x => x.mots);
        ecrire({ monde: idMonde, niveau: niv, structures, modelesDistincts: modeles.size, motsMoyen: Math.round(mots.reduce((a, b) => a + b, 0) / mots.length), motsMax: Math.max(...mots),
          pieges: liste.filter(x => x.piege).length, erreursJS, liste });
        return;
      }
      else if (ecran === 'planete') {
        const m = Mondes.get(idMonde);
        let cible = null;
        if (P('pnj')) cible = m.pnj.find(p => p.id === P('pnj'));
        else if (P('coffre')) cible = m.coffres.find(c => c.id === P('coffre'));
        else if (P('panneau')) cible = m.panneaux.find(c => c.id === P('panneau'));
        else if (P('fusee')) cible = m.fusee;
        else if (P('porte')) { const z = m.zones.find(z => z.id === +P('porte')); cible = { x: z.portes[0][0], y: z.portes[0][1] }; }
        if (P('scenario') === 'zone') {
          // 7 problèmes faits : Tobo et Zubi... le 8e (Pipa, 4e problème) ouvre le Village
          const e = Store.planete(idMonde);
          const z1 = m.pnj.filter(p => p.zone === 1);
          e.pnj[z1[0].id] = 4; e.pnj[z1[1].id] = 3; e.resolus = 7; e.zones = [1];
          cible = z1[1];
        } else if (P('scenario') === 'chef') {
          const e = Store.planete(idMonde);
          m.pnj.forEach(p => { e.pnj[p.id] = p.chef ? 3 : 4; });
          e.resolus = 47; e.zones = [1, 2, 3, 4];
          cible = m.pnj.find(p => p.chef);
        }
        if (cible) {
          const v = caseLibreVoisine(m, cible.x, cible.y);
          if (v) Store.planete(idMonde).pos = v;
          rapport.cible = { x: cible.x, y: cible.y, alvin: v };
        }
        Jeu.ouvrirPlanete(idMonde);
        await pause(400);
        if (P('bulle') === '0') { const b = document.querySelector('.hud-bulle [aria-label="Fermer"]'); if (b) b.click(); }
        if (P('taper')) {
          // un vrai toucher sur l'écran à l'endroit de la case (x,y) : surTouche puis marche
          const [tx, ty] = P('taper').split(',').map(Number);
          const mo = Jeu.debug().moteur;
          const cv = document.querySelector('.monde-canvas');
          const r = cv.getBoundingClientRect();
          const cam = mo.camera, T = 64 * cam.zoom;
          const px = r.width / 2 + (tx + 0.5 - cam.x) * T, py = r.height / 2 + (ty + 0.5 - cam.y) * T;
          rapport.tap = { px: Math.round(px), py: Math.round(py) };
          for (const type of ['pointerdown', 'pointerup']) cv.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: px, clientY: py, pointerId: 3, isPrimary: true, pointerType: 'touch' }));
          await pause(+(P('marche') || 4000));
          rapport.bulleApresTap = (document.querySelector('.hud-bulle:not([hidden]) .hud-bulle-texte') || {}).textContent || null;
          rapport.dialogueApresTap = (document.querySelector('.dialogue-texte') || {}).textContent || null;
        }
        if (cible) {
          Jeu.debug().moteur.allerVers(cible.x, cible.y);
          await pause(300);
          rapport.dialogue = (document.querySelector('.dialogue-texte') || {}).textContent || null;
          rapport.modal = (document.querySelector('.modal') || {}).textContent || null;
          if (P('coffre') && P('faux') === '1') {
            const k = document.querySelector('.modal-coffre .expr').textContent;
            document.querySelectorAll('.modal-coffre .touche')[0].click();
            document.querySelector('.modal-coffre .touche.valider').click();
            rapport.calcul = k;
          }
          if (P('aider') === '1' || P('scenario')) {
            Resolution.regler({ tempo: 0.02 });
            taper(document.querySelector('.dialogue-boutons .btn.principal'), 'bouton Aider');
            await attendre(() => RD().actif, 'résolution ouverte');
            const arret = P('etape') || (P('scenario') ? 'apres' : 'lire');
            const d = await avancerJusqua(arret === 'apres' ? 'fin' : arret);
            rapport.probleme = { id: d.probleme && d.probleme.id, texte: d.probleme && d.probleme.oral, etapes: d.etapes };
            if (arret === 'apres') {
              await pause(100);
              taper(document.querySelector('#resolution [data-action="continuer"]'), 'continuer');
              Resolution.regler({ tempo: 1 });
              await pause(+(P('apresAttente') || 400));
              rapport.dialogue = (document.querySelector('.dialogue-texte') || {}).textContent || null;
              rapport.modal = (document.querySelector('.modal') || {}).textContent || null;
              rapport.bulle = (document.querySelector('.hud-bulle:not([hidden]) .hud-bulle-texte') || {}).textContent || null;
              // enchaîner les fenêtres (dialogue merci → toast → pièce de fusée → …)
              for (let i = 0; i < +(P('suivre') || 0); i++) {
                const b = document.querySelector('.modal .btn.principal, .dialogue-boutons .btn.principal');
                if (!b) break;
                b.click();
                await pause(700);
                rapport['apres' + (i + 1)] = ((document.querySelector('.modal') || document.querySelector('.dialogue') || document.querySelector('.hud-bulle:not([hidden])') || {}).textContent || '').slice(0, 300);
              }
            } else {
              Resolution.regler({ tempo: 1 });
              await pause(60);
              if (P('faute') === '1') { await agir(RD(), true); await pause(+(P('fauteAttente') || 300)); }
              for (let i = 0; i < +(P('indice') || 0); i++) { const b = $('[data-action="indice"]'); if (b && !b.hidden) b.click(); await pause(50); }
              if (P('outil') === '1') { const b = $('.res-btn-outil'); if (b) b.click(); await pause(50); }
              rapport.bulle = RD().bulle;
            }
          }
        }
        // &figer=1 : plus aucun minuteur après le scénario (la bulle et les fenêtres restent pour la capture)
        if (P('figer') === '1') { window.setTimeout = () => 0; }
        const j = Jeu.debug();
        rapport.joueur = j.moteur ? { ...j.moteur.joueur } : null;
        rapport.camera = j.moteur ? { ...j.moteur.camera } : null;
      }
    } catch (e) {
      rapport.exception = e.message;
      rapport.pile = String(e.stack).split('\n').slice(0, 4);
    }
    // Mesures de lisibilité : tailles de police des textes visibles
    const tailles = {};
    for (const sel of ['.hud-bulle-texte', '.dialogue-texte', '.res-enonce-texte', '.res-bulle-texte', '.res-consigne', '.histoire-texte', '.espace-detail', '.carnet-role', '.hud-planete-textes span', '.hud-objectif', '.res-phrase-choix', '.res-carte', '.btn', '.res-etapes .nom', '.titre-sous', '.toast']) {
      const el = document.querySelector(sel);
      if (el && el.offsetParent !== null) { const cs = getComputedStyle(el); tailles[sel] = cs.fontSize + ' ' + cs.fontFamily.split(',')[0]; }
    }
    rapport.tailles = tailles;
    rapport.opacites = Object.fromEntries(['.hud-bulle', '.dialogue', '.modal', '.res-fin'].map(s => [s, document.querySelector(s) ? getComputedStyle(document.querySelector(s)).opacity : null]));
    rapport.animations = document.getAnimations ? document.getAnimations().map(a => (a.animationName || a.constructor.name) + ':' + a.playState + ':' + Math.round(a.currentTime || 0)).slice(0, 12) : null;
    rapport.polices = { andika: document.fonts.check('16px Andika'), fredoka: document.fonts.check('16px Fredoka') };
    rapport.debordement = { largeur: document.documentElement.scrollWidth, hauteur: document.documentElement.scrollHeight, vue: [innerWidth, innerHeight] };
    rapport.toast = document.getElementById('toast').classList.contains('visible') ? document.getElementById('toast').textContent : null;
    ecrire(rapport);
  })().catch(e => { document.getElementById('resultat').textContent = JSON.stringify({ ok: false, exception: e.message }); });
  </script>
</body>
</html>
